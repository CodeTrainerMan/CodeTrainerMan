name: Link check

# The profile README pulls ~30 icons from third-party CDNs (devicon via jsDelivr,
# shields.io, githubassets, a Discord invite). Any of them can start returning 404
# without warning, and a broken icon is invisible until somebody looks closely.
# This workflow fails the build instead.

on:
  push:
    branches: [main]
  # Deliberately NOT triggered by pull_request. lychee probes ~30 third-party CDNs,
  # so one transient network error on one of them turned a PR that had only touched
  # a YAML file red. That is noise, not signal. The weekly run below is the safety
  # net for links that genuinely rot between commits.
  schedule:
    # Every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check every link in the README
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200..=299,403,429
            --exclude '^https://(www\.)?(twitter|x|instagram)\.com'
            README.md
          fail: true
